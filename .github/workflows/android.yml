name: Build JARVIS APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: unzip -q *.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        run: gradle -p JARVIS-Android-v0.4.0 assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-APK
          path: JARVIS-Android-v0.4.0/app/build/outputs/apk/debug/app-debug.apk
