
name: Build JARVIS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Extrair projeto
        run: unzip -q JARVIS-Business-v0.11.0.zip

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compilar aplicação
        run: gradle -p JARVIS-Android-v0.4.0 assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-APK
          path: JARVIS-Android-v0.4.0/app/build/outputs/apk/debug/app-debug.apk